server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for the UI and the API: no CORS needed in production.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # LLM answers can take several seconds
    }
    location = /ready {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
