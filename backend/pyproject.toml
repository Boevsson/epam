[project]
name = "filings-qa"
version = "0.1.0"
description = "Hybrid-search question answering over SEC 10-K filings (NovaBridge Capital prototype)"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.13",
    "numpy>=2.5.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pystemmer>=3.1.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
filings-qa = "filings_qa.entrypoints.cli.main:app"

# CPU-only PyTorch on Linux (Docker): the default CUDA build pulls several GB of NVIDIA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow (model download), eval (real corpus) and live (paid API) tests are opt-in: pytest -m slow, -m eval, -m live
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow and not eval and not live"]
xfail_strict = true
markers = [
    "slow: needs ML models or large files",
    "e2e: exercises the HTTP API end to end",
    "eval: measures retrieval and answer quality on the real corpus",
    "live: calls a paid external API (needs ANTHROPIC_API_KEY)",
]

[tool.coverage.run]
source = ["filings_qa"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["filings_qa", "tests"]

[tool.mypy]
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
untyped_calls_exclude = ["pymupdf"]  # PyMuPDF ships partial annotations

[[tool.mypy.overrides]]
module = ["Stemmer", "bm25s", "bm25s.*"]
ignore_missing_imports = true

# Architecture rules: the dependency rule from docs/technical-analysis.md §3.1, checked in CI.
[tool.importlinter]
root_package = "filings_qa"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers inside each bounded context"
type = "layers"
containers = ["filings_qa.ingestion", "filings_qa.research"]
layers = ["adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = ["filings_qa.ingestion", "filings_qa.research"]

[[tool.importlinter.contracts]]
name = "Domain and shared kernel are framework-free"
type = "forbidden"
source_modules = ["filings_qa.ingestion.domain", "filings_qa.research.domain", "filings_qa.shared_kernel"]
forbidden_modules = [
    "filings_qa.infrastructure",
    "filings_qa.entrypoints",
    "fastapi",
    "pydantic",
    "numpy",
    "faiss",
    "bm25s",
    "pymupdf",
    "fitz",
    "sentence_transformers",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "Entrypoints never touch adapters (only bootstrap wires them)"
type = "forbidden"
source_modules = ["filings_qa.entrypoints"]
forbidden_modules = ["filings_qa.ingestion.adapters", "filings_qa.research.adapters"]
